# Kafka Topics for the E-Commerce Streaming Pipeline
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: raw-events
  namespace: streaming
  labels:
    strimzi.io/cluster: streaming-kafka
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: "86400000"      # 24 hours
    min.insync.replicas: "2"
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: enriched-events
  namespace: streaming
  labels:
    strimzi.io/cluster: streaming-kafka
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: "86400000"
    min.insync.replicas: "2"
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: aggregated-metrics
  namespace: streaming
  labels:
    strimzi.io/cluster: streaming-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: "86400000"
    min.insync.replicas: "2"
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: fraud-alerts
  namespace: streaming
  labels:
    strimzi.io/cluster: streaming-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "86400000"
    min.insync.replicas: "2"
    cleanup.policy: delete
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: dead-letter
  namespace: streaming
  labels:
    strimzi.io/cluster: streaming-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "604800000"    # 7 days for investigation
    min.insync.replicas: "2"
    cleanup.policy: delete
