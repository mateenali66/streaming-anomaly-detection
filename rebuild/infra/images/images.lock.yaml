# images.lock.yaml  (template, committed; digests are filled in by the scripts, then committed again)
#
# One entry per image any cluster runs. Nothing pulls from Docker Hub, quay.io, ghcr.io or registry.k8s.io at run time:
# every image is in the project's ECR, referenced as <registry>/<project>/<repo>:<tag>@<digest>.
#
#   built:    images this repository builds (arm64, buildx). scripts/build_images.sh pushes them and writes tag + digest.
#   mirrored: public images. scripts/mirror_images.py resolves the upstream digest, checks that the image has a
#             linux/arm64 entry, copies it into ECR with the SAME digest and writes the digest back here.
#   build_bases: base images used only inside Dockerfiles on the build machine. Pinned by digest for provenance.
#
# The cluster root (terraform/cluster) refuses to plan while any digest is empty (var.enforce_image_digests).
# The repos listed here are created by terraform/shared, so a new image needs a shared apply first.
schema: 1
platform: linux/arm64

