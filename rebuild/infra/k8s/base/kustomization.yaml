apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Everything both workloads share. k8s/ecommerce and k8s/iot add the workload ConfigMaps, the load generator settings and the
# Flink submit Job. scripts/deploy_workload.sh applies the phases in order with `kubectl apply -l infra.phase=<phase>`.
resources:
  - kafka
  - flink
  - rbac
  - orchestrator
  - exporter
  - loadgen
  - probes
  - watchdog
