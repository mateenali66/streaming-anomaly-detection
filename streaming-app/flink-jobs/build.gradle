plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.github.johnrengelman.shadow'

    group = 'com.phonotech.streaming'
    version = '1.0.0'

    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    ext {
        flinkVersion = '1.19.1'
        kafkaConnectorVersion = '3.2.0-1.19'
        avroVersion = '1.11.4'
        slf4jVersion = '2.0.16'
    }

    repositories {
        mavenCentral()
        maven { url 'https://packages.confluent.io/maven/' }
    }

    dependencies {
        // Flink core (provided at runtime by the Flink cluster)
        compileOnly "org.apache.flink:flink-streaming-java:${flinkVersion}"
        compileOnly "org.apache.flink:flink-clients:${flinkVersion}"
        compileOnly "org.apache.flink:flink-runtime-web:${flinkVersion}"

        // Kafka connector
        implementation "org.apache.flink:flink-connector-kafka:${kafkaConnectorVersion}"

        // Avro
        implementation "org.apache.flink:flink-avro:${flinkVersion}"
        implementation "org.apache.avro:avro:${avroVersion}"

        // JSON (for enrichment catalog and fraud output)
        implementation "org.apache.flink:flink-json:${flinkVersion}"

        // Logging
        implementation "org.slf4j:slf4j-api:${slf4jVersion}"
        runtimeOnly "org.slf4j:slf4j-simple:${slf4jVersion}"
    }

    shadowJar {
        archiveBaseName.set(project.name)
        archiveClassifier.set('all')
        mergeServiceFiles()
        manifest {
            attributes 'Main-Class': project.ext.has('mainClass') ? project.ext.mainClass : ''
        }
    }
}
